  try {
    const qr = qrcode(0, "L");
    qr.addData(link); qr.make();
    const box = $("#teilenQr");
    box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    box.hidden = false;
  } catch (e) {
    $("#teilenQrHinweis").textContent = "Für einen QR-Code sind es zu viele Daten. Schick einfach den Link, z.B. per WhatsApp an dich selbst.";
  }
}

/* Beim Öffnen eines Übertragungs-Links: fragen, ob hinzufügen oder ersetzen */
let eingang = null;
async function uebernahmePruefen() {
  const m = location.hash.match(/^#daten=(.+)$/);
  if (!m) return;
  history.replaceState(history.state, "", location.pathname + location.search);
  try { eingang = await entpacken(m[1]); } catch (e) { meldung("Der Link ist leider beschädigt."); return; }
  const teile = TEILE.filter(([k]) => Array.isArray(eingang[k]) && eingang[k].length);
  if (!teile.length) { meldung("Im Link sind keine Daten."); return; }
  const el = $("#uebernahme");
  el.innerHTML = `<div class="detail-karte">
    <div class="detail-kopf"><span class="markt" style="color:var(--tinte)">Daten übernehmen</span><button class="detail-zu" data-uebernahme-zu aria-label="Schließen">×</button></div>
    <p style="margin:0">Dieser Link enthält:</p>
    <ul style="margin:0;padding-left:20px">${teile.map(([k, n]) => `<li>${n}: ${eingang[k].length} ${eingang[k].length === 1 ? "Eintrag" : "Einträge"}</li>`).join("")}</ul>
    <p class="erkl" style="margin:0;color:var(--grau);font-size:14px"><strong>Hinzufügen</strong> behält deine Einträge und ergänzt die neuen. <strong>Ersetzen</strong> überschreibt diese Listen auf diesem Gerät.</p>
    <button class="knopf detail-aktion" data-uebernahme="dazu">Hinzufügen</button>
    <div class="detail-knoepfe">
      <button class="knopf leise" data-uebernahme="ersetzen">Ersetzen</button>
      <button class="knopf leise" data-uebernahme-zu>Abbrechen</button>
    </div>
  </div>`;
  el.hidden = false;
}
function uebernehmen(art) {
  const schl = { vorrat: (x) => norm(x.name), rezepte: (x) => norm(x.name), liste: (x) => x.id };
  let n = 0;
  for (const [k] of TEILE) {
    const neu = eingang && eingang[k];
    if (!Array.isArray(neu) || !neu.length) continue;
    if (art === "ersetzen") { zustand[k] = neu; n += neu.length; continue; }
    const alt = zustand[k] || (zustand[k] = []);
    const key = schl[k] || ((x) => norm(x));
    const da = new Map(alt.map((x, i) => [key(x), i]));
    for (const x of neu) {
      if (!da.has(key(x))) { alt.push(x); n++; }
      else if (k === "rezepte") { alt[da.get(key(x))] = x; n++; }  // Rezept mit gleichem Namen: neue Fassung
    }
  }
  speichern();
  eingang = null;
  $("#uebernahme").hidden = true;
  listenZaehler(); vorratZaehler();
  if (angebote.length) { nieFiltern(); neuZeichnen(); }
  meldung(art === "ersetzen" ? "Daten übernommen" : `${n} ${n === 1 ? "Eintrag" : "Einträge"} hinzugefügt`);
}

/* ---------- Einstellungen ---------- */
function zeichneEinstellungen() {
  const el = $("#v-einst");
  const alle = daten ? daten.maerkte : [];
  const aktiv = new Set(aktiveMaerkte());
  const quellen = daten ? Object.entries(daten.quellen || {}) : [];
  el.innerHTML = `
    <button class="knopf leise hilfe-knopf" data-gehe="hilfe">So funktioniert die App</button>
    <div class="abschnitt">
      <h2>Vorlieben</h2>
      <p class="erkl">Produkte oder Marken, die dich interessieren. Unter „Für dich“ siehst du die günstigsten Angebote dazu.</p>
      <div class="tag-liste">${zustand.vorlieben.map((v, i) =>
        `<span class="tag">${esc(v)}<button data-vorliebe-weg="${i}" aria-label="${esc(v)} entfernen">×</button></span>`).join("")}</div>
      <form class="zeile-form" id="vorliebeForm">
        <label for="vorliebeNeu" class="sr">Neue Vorliebe</label>
        <input id="vorliebeNeu" placeholder="z.B. Kerrygold, Joghurt" autocomplete="off" enterkeyhint="done">
        <button class="knopf" type="submit">Hinzufügen</button>
      </form>
    </div>
    <div class="abschnitt">
      <h2>Favoriten</h2>
      <p class="erkl">Tipp bei einem Angebot aufs Bild und dann auf „Als Favorit“. Sobald das Produkt wieder irgendwo im Angebot ist, steht es oben unter „Für dich“.</p>
      ${zustand.favoriten.length ? `<div class="tag-liste">${zustand.favoriten.map((v, i) =>
        `<span class="tag">★ ${esc(v)}<button data-favorit-weg="${i}" aria-label="${esc(v)} entfernen">×</button></span>`).join("")}</div>`
        : `<p class="erkl">Noch keine Favoriten.</p>`}
    </div>
    <div class="abschnitt">
      <h2>Nie anzeigen</h2>
      <p class="erkl">Diese Produkte, Marken oder Begriffe werden überall ausgeblendet. Ein Wort wie „feucht“ blendet z.B. feuchtes Toilettenpapier aus.</p>
      ${zustand.nie.length ? `<div class="tag-liste">${zustand.nie.map((v, i) => {
        const n = nieAnzahl(v);
        return `<span class="tag">${esc(v)}${n ? ` <span style="color:var(--grau);font-size:13px">(${n})</span>` : ""}<button data-nie-weg="${i}" aria-label="${esc(v)} wieder anzeigen">×</button></span>`;
      }).join("")}</div>` : ""}
      <form class="zeile-form" id="nieForm">
        <label for="nieNeu" class="sr">Neuer Begriff zum Ausblenden</label>
        <input id="nieNeu" placeholder="z.B. Cottonelle, Fischstäbchen" autocomplete="off" enterkeyhint="done">
        <button class="knopf" type="submit">Ausblenden</button>
      </form>
    </div>
    <div class="abschnitt">
      <div class="abschnitt-kopf"><h2>Märkte</h2>
        <button class="textknopf" data-alle-maerkte="${aktiv.size === alle.length ? "aus" : "an"}">${aktiv.size === alle.length ? "Alle abwählen" : "Alle auswählen"}</button></div>
      <p class="erkl">Nur diese Märkte werden angezeigt.</p>
      <div class="markt-raster">${alle.map((m) =>
        `<button class="chip" data-markt-schalter="${esc(m)}" aria-pressed="${aktiv.has(m)}">${esc(m)}</button>`).join("")}</div>
    </div>
    <div class="abschnitt">
      <h2>Daten übertragen</h2>
      <p class="erkl">Listen von diesem Gerät auf ein anderes bringen, z.B. vom PC aufs Handy oder an die Familie. Es wird der jetzige Stand übertragen, kein dauerhafter Abgleich.</p>
      <div class="teile-teile">${TEILE.map(([k, name]) => {
        const n = (zustand[k] || []).length;
        return `<label><input type="checkbox" data-teil="${k}" ${n ? "checked" : "disabled"}>${name} <span class="klein" style="color:var(--grau)">(${n})</span></label>`;
      }).join("")}</div>
      <button class="knopf" data-teilen-link>Link und QR-Code erstellen</button>
      <div id="teilenErgebnis"></div>
    </div>
    <div class="abschnitt">
      <h2>Ort</h2>
      <div class="wahl">${(index ? index.regionen : []).map((r) =>
        `<label><input type="radio" name="region" value="${esc(r.id)}" ${r.id === zustand.region ? "checked" : ""}>${esc(r.name)}<span class="klein">${r.anzahl} Angebote</span></label>`).join("")}</div>
    </div>
    <div class="abschnitt">
      <h2>Datenquellen</h2>
      <p class="erkl">Die Angebote werden jeden Morgen automatisch aus öffentlichen Prospekten gesammelt. Preise ohne Gewähr.</p>
      <ul class="quellen">${quellen.map(([n, s]) =>
        `<li>${esc(n)}: ${s.ok ? `${s.anzahl} Angebote` : `<span class="fehler">nicht erreichbar</span>`}</li>`).join("")}</ul>
    </div>`;
}

/* =========================================================================
   Ereignisse
   ========================================================================= */
document.addEventListener("click", async (ev) => {
  if (ev.target.id === "detail") { history.back(); return; }  // Tipp neben die Karte
  if (ev.target.id === "uebernahme") { $("#uebernahme").hidden = true; return; }
  const t = ev.target.closest("button, [data-region]");
  if (!t) return;
  const d = t.dataset;

  if (d.detail) oeffneDetail(d.detail);
  else if (d.detailZu !== undefined) history.back();
  else if (d.ziel) geheZu({ ansicht: d.ziel, gruppe: d.ziel === "suche" ? sucheGruppe : null });
  else if (d.gehe) geheZu({ ansicht: d.gehe, gruppe: null });
  else if (d.hilfe) { hilfeOffen = d.hilfe; geheZu({ ansicht: "hilfe", gruppe: null }); }
  else if (d.region) {
    zustand.region = d.region; speichern();
    await start();
  }
  else if (d.merken) merken(d.merken);
  else if (d.favorit) favoritUmschalten(d.favorit);
  else if (d.nie) {
    const a = angebote.find((x) => x.id === d.nie);
    if (a) {
      nieHinzufuegen(produktText(a));
      history.back();  // schließt die Detailansicht
      meldung(`„${produktText(a)}“ wird nicht mehr angezeigt`);
    }
  }
  else if (d.favoritWeg !== undefined) {
    zustand.favoriten.splice(+d.favoritWeg, 1);
    speichern(); zeichneEinstellungen();
  }
  else if (d.nieWeg !== undefined) {
    const v = zustand.nie.splice(+d.nieWeg, 1)[0];
    speichern(); nieFiltern(); vorratZaehler(); zeichneEinstellungen();
    if (v) meldung(`„${v}“ wird wieder angezeigt`);
  }
  else if (d.suche !== undefined) {
    $("#such").value = d.suche;
    if (aktuelleAnsicht === "suche" && !sucheGruppe) zeichneSuche();
    else geheZu({ ansicht: "suche", gruppe: null });
  }
  else if (d.klappen) {
    ausgeklappt.has(d.klappen) ? ausgeklappt.delete(d.klappen) : ausgeklappt.add(d.klappen);
    zeichneFuerDich();
  }
  else if (d.markt !== undefined) {
    sucheMarkt = d.markt || null;
    anzeigeLimit = 50;
    zeichneSuche();
  }
  else if (d.unter !== undefined) {
    sucheUnter = d.unter || null;
    anzeigeLimit = 50;
    zeichneSuche();
  }
  else if (d.gruppe !== undefined) {
    if (d.gruppe) {
      $("#such").value = "";
      geheZu({ ansicht: "suche", gruppe: d.gruppe });
    } else if (history.state && history.state.gruppe) {
      history.back();  // Pfeil in der Kategorie = Zurück-Taste
    } else {
      wendeAn({ ansicht: "suche", gruppe: null });
    }
  }
  else if (d.sort) {
    sortierung = d.sort;
    zeichneSuche();
  }
  else if (d.mehr !== undefined) {
    anzeigeLimit += 50;
    zeichneSuche();
  }
  else if (d.marktSchalter) {
    const aktiv = new Set(aktiveMaerkte());
    aktiv.has(d.marktSchalter) ? aktiv.delete(d.marktSchalter) : aktiv.add(d.marktSchalter);
    maerkteMerken(aktiv);
    vorratZaehler();
    if (sucheMarkt && !aktiv.has(sucheMarkt)) sucheMarkt = null;
    speichern();
    zeichneEinstellungen();
  }
  else if (d.alleMaerkte) {
    maerkteMerken(d.alleMaerkte === "an" ? daten.maerkte : []);
    vorratZaehler();
    sucheMarkt = null;
    speichern();
    zeichneEinstellungen();
  }
  else if (d.teilenLink !== undefined) teilenLinkErstellen();
  else if (d.teilenKopieren !== undefined) {
    try { await navigator.clipboard.writeText($("#teilenErgebnis").dataset.link); meldung("Link kopiert"); }
    catch (e) { $("#teilenLink").select(); meldung("Link markiert – jetzt kopieren"); }
  }
  else if (d.teilenSenden !== undefined) {
    const link = $("#teilenErgebnis").dataset.link;
    try { if (navigator.share) await navigator.share({ title: "Angebote-App: meine Listen", url: link }); else { await navigator.clipboard.writeText(link); meldung("Link kopiert"); } }
    catch (e) { /* abgebrochen */ }
  }
  else if (d.uebernahme) uebernehmen(d.uebernahme);
  else if (d.uebernahmeZu !== undefined) { eingang = null; $("#uebernahme").hidden = true; }
  else if (d.rezeptNeu !== undefined) { rezeptBearbeiten = "neu"; zeichneVorrat(); $("#rezeptName").focus(); }
  else if (d.rezeptAbbruch !== undefined) { rezeptBearbeiten = null; zeichneVorrat(); }
  else if (d.rezeptBearbeiten !== undefined) { rezeptBearbeiten = +d.rezeptBearbeiten; zeichneVorrat(); }
  else if (d.rezeptWeg !== undefined) {
    const r = zustand.rezepte[+d.rezeptWeg];
    if (r && confirm(`Rezept „${r.name}“ löschen?`)) {
      zustand.rezepte.splice(+d.rezeptWeg, 1); rezeptOffen.clear(); rezeptBearbeiten = null;
      speichern(); zeichneVorrat(); meldung(`„${r.name}“ gelöscht`);
    }
  }
  else if (d.rezeptMarkt !== undefined) { zustand.rezeptMarkt = d.rezeptMarkt || null; speichern(); zeichneVorratBehalten(); }
  else if (d.zutatAuf !== undefined) {
    zutatOffen.has(d.zutatAuf) ? zutatOffen.delete(d.zutatAuf) : zutatOffen.add(d.zutatAuf);
    zeichneVorratBehalten();
  }
  else if (d.rezeptAuf !== undefined) {
    const i = +d.rezeptAuf;
    rezeptOffen.has(i) ? rezeptOffen.delete(i) : rezeptOffen.add(i);
    zeichneVorratBehalten();
  }
  else if (d.rezeptListe !== undefined) { rezeptAufListe(+d.rezeptListe); zeichneVorratBehalten(); }
  else if (d.vorratNeu) {
    vorratHinzufuegen(d.vorratNeu);
    meldung(`„${d.vorratNeu}“ zum Vorrat hinzugefügt`);
    zeichneVorrat(); vorratZaehler();
  }
  else if (d.vorratAuf !== undefined) {
    vorratOffen.has(d.vorratAuf) ? vorratOffen.delete(d.vorratAuf) : vorratOffen.add(d.vorratAuf);
    zeichneVorrat();
  }
  else if (d.vorratWeg !== undefined) {
    const v = zustand.vorrat[+d.vorratWeg];
    if (v) {
      zustand.vorrat.splice(+d.vorratWeg, 1);
      vorratOffen.delete(v.name);
      speichern(); vorratZaehler(); zeichneVorrat();
      meldung(`„${v.name}“ entfernt`);
    }
  }
  else if (d.vorliebeWeg !== undefined) {
    zustand.vorlieben.splice(+d.vorliebeWeg, 1);
    speichern();
    zeichneEinstellungen();
  }
  else if (d.entfernen) {
    zustand.liste = zustand.liste.filter((p) => p.id !== d.entfernen);
    speichern(); listenZaehler(); zeichneListe();
  }
  else if (d.aktion === "erledigte") {
    zustand.liste = zustand.liste.filter((p) => !p.erledigt);
    speichern(); listenZaehler(); zeichneListe();
  }
  else if (d.aktion === "leeren") {
    if (confirm("Wochenliste komplett leeren?")) {
      zustand.liste = []; speichern(); listenZaehler(); zeichneListe();
    }
  }
  else if (d.aktion === "teilen") listeTeilen();
  else if (t.id === "leeren") { $("#such").value = ""; zeichneSuche(); $("#such").focus(); }
  else if (t.id === "ortKnopf") geheZu({ ansicht: "einst", gruppe: null });
});

document.addEventListener("change", async (ev) => {
  const t = ev.target;
  if (t.dataset.rezeptDa !== undefined) {
    const r = zustand.rezepte[+t.dataset.rezeptDa];
    if (r) {
      const z = t.dataset.zutat;
      r.da = (r.da || []).filter((x) => x !== z);
      if (t.checked) r.da.push(z);
      speichern(); zeichneVorratBehalten();
    }
    return;
  }
  if (t.dataset.vorratZielEinheit !== undefined) {
    const v = zustand.vorrat[+t.dataset.vorratZielEinheit];
    if (v) {
      v.zielEinheit = t.value;
      speichern(); vorratZaehler(); zeichneVorrat();
      if (v.ziel != null) meldung(`${v.name}: gut bis ${eur(v.ziel)} pro ${EINHEIT_NAME[t.value] || t.value}`);
    }
    return;
  }
  if (t.dataset.vorratZiel !== undefined) {
    const v = zustand.vorrat[+t.dataset.vorratZiel];
    if (v) {
      const wert = parseFloat(t.value.replace(",", ".").replace(/[^0-9.]/g, ""));
      if (isFinite(wert) && wert > 0) {
        v.ziel = Math.round(wert * 100) / 100;
        const e = v.zielEinheit || "packung";
        meldung(`${v.name}: gut bis ${eur(v.ziel)} pro ${EINHEIT_NAME[e] || e}`);
      }
      else { delete v.ziel; meldung(`${v.name}: Wunschpreis entfernt`); }
      speichern(); vorratZaehler(); zeichneVorrat();
    }
    return;
  }
  if (t.dataset.vorratHaken !== undefined) {
    const v = zustand.vorrat[+t.dataset.vorratHaken];
    if (v) {
      v.leer = t.checked;
      speichern(); vorratZaehler(); zeichneVorrat();
      meldung(v.leer ? `${v.name}: bald leer – alle Angebote werden gezeigt` : `${v.name}: genug da`);
    }
    return;
  }
  if (t.dataset.abhaken) {
    const p = zustand.liste.find((x) => x.id === t.dataset.abhaken);
    if (p) { p.erledigt = t.checked; speichern(); listenZaehler(); zeichneListe(); }
  }
  if (t.name === "region") {
    zustand.region = t.value; sucheMarkt = null; speichern();
    await ladeRegionSicher();
    zeichneEinstellungen();
    meldung("Ort geändert");
  }
});

document.addEventListener("submit", (ev) => {
  if (ev.target.id === "vorratForm") {
    ev.preventDefault();
    const inp = $("#vorratNeu");
    if (vorratHinzufuegen(inp.value)) meldung(`„${inp.value.trim()}“ zum Vorrat hinzugefügt`);
    zeichneVorrat(); vorratZaehler();
    $("#vorratNeu").focus();
    return;
  }
  if (ev.target.id === "rezeptForm") {
    ev.preventDefault();
    const name = $("#rezeptName").value.trim();
    const zutaten = zutatenAus($("#rezeptZutaten").value);
    if (!name || !zutaten.length) { meldung("Bitte Name und mindestens eine Zutat eintragen"); return; }
    const idx = ev.target.dataset.idx;
    if (idx === "neu") {
      zustand.rezepte.push({ name, zutaten, da: [] });
      rezeptOffen.add(zustand.rezepte.length - 1);
    } else {
      const r = zustand.rezepte[+idx];
      r.name = name; r.zutaten = zutaten; r.da = (r.da || []).filter((z) => zutaten.includes(z));
    }
    rezeptBearbeiten = null;
    speichern(); zeichneVorrat();
    meldung(`„${name}“ gespeichert`);
    return;
  }
  if (ev.target.id === "nieForm") {
    ev.preventDefault();
    const v = $("#nieNeu").value.trim();
    if (v && nieHinzufuegen(v)) meldung(`${nieAnzahl(v) === 1 ? "1 Angebot" : nieAnzahl(v) + " Angebote"} ausgeblendet`);
    zeichneEinstellungen();
    $("#nieNeu").focus();
    return;
  }
  if (ev.target.id !== "vorliebeForm") return;
  ev.preventDefault();
  const inp = $("#vorliebeNeu");
  const v = inp.value.trim();
  if (v && !zustand.vorlieben.some((x) => norm(x) === norm(v))) {
    zustand.vorlieben.push(v);
    speichern();
  }
  zeichneEinstellungen();
  $("#vorliebeNeu").focus();
});

let suchTimer;
$("#such").addEventListener("input", () => {
  clearTimeout(suchTimer);
  suchTimer = setTimeout(zeichneSuche, 150);
});

/* =========================================================================
   Start
   ========================================================================= */
function fehlerAnzeigen() {
  $("#v-fuerdich").innerHTML = `<div class="leer-box"><p>Die Angebote konnten nicht geladen werden. Prüf deine Internetverbindung und lade die Seite neu.</p>
    <button class="knopf" onclick="location.reload()">Neu laden</button></div>`;
  zeige("fuerdich");
}

async function ladeRegionSicher() {
  try { await ladeRegion(); return true; }
  catch (e) { fehlerAnzeigen(); return false; }
}

window.addEventListener("hashchange", uebernahmePruefen);  // Link geöffnet, während die App schon läuft

async function start() {
  uebernahmePruefen();
  try { if (!index) await ladeIndex(); }
  catch (e) { fehlerAnzeigen(); return; }
  if (!zustand.region || !index.regionen.some((r) => r.id === zustand.region)) {
    zeichneStart();
    return;
  }
  if (await ladeRegionSicher()) {
    listenZaehler();
    vorratZaehler();
    ladeVerlauf().then(() => {
      vorratZaehler();
      if (aktuelleAnsicht === "vorrat") zeichneVorrat();
      else if (aktuelleAnsicht === "fuerdich") zeichneFuerDich();
    });
    history.replaceState({ ansicht: "fuerdich", gruppe: null }, "");
    zeige("fuerdich");
  }
}

start();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
