<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angebote</title>
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Angebote">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root {
  --papier: #F3F4F1;
  --karte: #FFFFFF;
  --tinte: #1D2321;
  --grau: #646B68;
  --linie: #DADDD8;
  --rot: #C8102E;
  --rot-dunkel: #9E0B23;
  --gelb: #FFD400;
  --gruen: #1F7A4D;
  --fokus: #1D5FD1;
  --r: 10px;
  --schrift: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #151918;
    --karte: #1E2321;
    --tinte: #EEF0EE;
    --grau: #A3AAA7;
    --linie: #333A37;
    --rot: #E0213F;
    --rot-dunkel: #B5142E;
    --gruen: #4CC488;
    --fokus: #7FA9FF;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--papier);
  color: var(--tinte);
  font-family: var(--schrift);
  font-size: 16px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--fokus); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Kopf ---------- */
.kopf {
  position: sticky; top: 0; z-index: 5;
  background: var(--papier);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  border-bottom: 1px solid var(--linie);
}
.kopf-zeile { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; max-width: 640px; margin: 0 auto; }
.kopf h1 {
  margin: 0; font-size: 26px; line-height: 1.1;
  font-stretch: 70%; font-weight: 800; letter-spacing: -0.01em;
}
.ort-knopf {
  background: none; border: 0; padding: 4px 0; color: var(--grau);
  font-size: 14px; text-decoration: underline; text-underline-offset: 3px; text-align: right;
}
.stand { max-width: 640px; margin: 2px auto 0; font-size: 12px; color: var(--grau); }

main { max-width: 640px; margin: 0 auto; padding: 12px 16px 24px; }
.ansicht[hidden] { display: none; }

/* ---------- Suche ---------- */
.suchfeld {
  display: flex; align-items: center; gap: 8px;
  background: var(--karte); border: 2px solid var(--tinte); border-radius: var(--r);
  padding: 4px 6px 4px 12px; margin-bottom: 10px;
}
.suchfeld input {
  flex: 1; border: 0; background: none; padding: 10px 0; font-size: 18px; min-width: 0;
}
.suchfeld input:focus { outline: none; }
.suchfeld:focus-within { outline: 3px solid var(--fokus); outline-offset: 2px; }
.leeren { border: 0; background: none; font-size: 22px; line-height: 1; padding: 6px 8px; color: var(--grau); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--linie); background: var(--karte);
  border-radius: 999px; padding: 6px 12px; font-size: 14px; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--tinte); color: var(--papier); border-color: var(--tinte); }
.vorschlaege { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 16px; }

.zwischentitel {
  font-size: 15px; font-weight: 700; margin: 18px 0 6px; color: var(--grau);
  font-stretch: 85%;
}
.zwischentitel:first-child { margin-top: 4px; }

/* ---------- Angebotszeile ---------- */
.liste { list-style: none; margin: 0; padding: 0; background: var(--karte); border-radius: var(--r); border: 1px solid var(--linie); overflow: hidden; }
.liste > li + li { border-top: 1px solid var(--linie); }
.angebot { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 12px 12px 14px; align-items: start; }
.angebot .markt { font-size: 13px; font-weight: 700; color: var(--grau); }
.angebot .name { font-size: 16px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.angebot .marke { font-weight: 400; color: var(--grau); }
.angebot .info { font-size: 13px; color: var(--grau); margin-top: 2px; }
.angebot .info .bald { color: var(--tinte); font-weight: 600; }
.angebot .rechts { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

/* Das Preisschild: das eine auffällige Element */
.schild {
  display: inline-flex; align-items: flex-start;
  background: var(--rot); color: #fff;
  border-radius: 4px; padding: 3px 8px 4px 9px;
  font-stretch: 62%; font-weight: 800; line-height: 1;
  box-shadow: 0 2px 0 var(--rot-dunkel);
}
.schild .euro { font-size: 30px; letter-spacing: -0.02em; }
.schild .cent { font-size: 16px; margin-top: 2px; margin-left: 1px; }
.schild.aktion { font-size: 17px; padding: 6px 9px; font-stretch: 75%; }
.alt { font-size: 13px; color: var(--grau); text-decoration: line-through; }
.spar {
  background: var(--gelb); color: #1D2321; font-weight: 800; font-size: 12px;
  padding: 2px 6px; border-radius: 3px; font-stretch: 80%;
}
.gp { font-size: 13px; color: var(--tinte); font-weight: 600; white-space: nowrap; }
.preiszeile { display: flex; gap: 6px; align-items: center; }

.angebot .links { display: flex; gap: 10px; align-items: flex-start; }
.merken {
  flex: none; width: 40px; height: 40px; margin-top: 4px;
  border: 1.5px solid var(--linie); background: var(--karte); border-radius: 50%;
  display: grid; place-items: center; padding: 0; color: var(--tinte);
}
.merken svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.merken[aria-pressed="true"] { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.suchfeld input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }

.mehr {
  display: block; width: 100%; border: 0; background: none; padding: 12px; font-size: 15px;
  font-weight: 600; color: var(--tinte); text-decoration: underline; text-underline-offset: 3px;
}

.hinweis { color: var(--grau); font-size: 15px; padding: 18px 4px; }
.hinweis strong { color: var(--tinte); }
.leer-box {
  background: var(--karte); border: 1px dashed var(--linie); border-radius: var(--r);
  padding: 18px 16px; color: var(--grau);
}
.leer-box p { margin: 0 0 12px; }
.knopf {
  display: inline-block; border: 0; border-radius: var(--r);
  background: var(--tinte); color: var(--papier); padding: 11px 16px; font-weight: 700;
}
.knopf.leise { background: none; color: var(--tinte); border: 1px solid var(--linie); }

/* ---------- Produktbild ---------- */
.bild {
  flex: none; width: 56px; height: 56px; border-radius: 8px; margin-top: 2px;
  background: #fff; border: 1px solid var(--linie); overflow: hidden;
  display: grid; place-items: center;
}
.bild img { width: 100%; height: 100%; object-fit: contain; display: block; }
.bild.leer { background: var(--papier); }
.bild.ausschnitt { position: relative; display: block; }
.bild.ausschnitt img { position: absolute; max-width: none; width: auto; height: auto; object-fit: fill; opacity: 0; }
.bild-rahmen { position: relative; flex: none; padding: 0 8px 8px 0; }
.bild-rahmen .merken {
  position: absolute; right: 0; bottom: 0; margin: 0;
  width: 32px; height: 32px; border-width: 1.5px; border-color: var(--tinte);
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.bild-rahmen .merken svg { width: 16px; height: 16px; }
/* größere unsichtbare Tippfläche */
/* nach außen großzügig, zur Bildmitte hin knapp – sonst würde ein Tipp aufs Bild "merken" auslösen */
.bild-rahmen .merken::after { content: ""; position: absolute; inset: -2px -8px -8px -2px; }

button.bild { padding: 0; cursor: zoom-in; font: inherit; }

/* ---------- Detailansicht (großes Bild) ---------- */
.detail {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(10, 12, 11, .72);
  display: grid; place-items: end center;
  padding: env(safe-area-inset-top, 0px) 0 0;
}
.detail[hidden] { display: none; }
.detail-karte {
  width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto;
  background: var(--karte); color: var(--tinte);
  border-radius: 16px 16px 0 0;
  padding: 12px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
  box-shadow: inset 0 5px 0 var(--mf, transparent);
  display: grid; gap: 12px;
}
.detail-kopf { display: flex; justify-content: space-between; align-items: center; }
.detail-kopf .markt { font-size: 15px; font-weight: 800; color: var(--mf, var(--grau)); }
.detail-zu { border: 0; background: none; font-size: 28px; line-height: 1; padding: 4px 8px; color: var(--grau); }
.detail-bild {
  position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: 52vh;
  background: #fff; border-radius: 12px; overflow: hidden; display: grid; place-items: center;
}
.detail-bild img.ganz { width: 100%; height: 100%; object-fit: contain; }
.detail-bild.ausschnitt img { position: absolute; max-width: none; opacity: 0; }
.detail-bild.leer { background: var(--papier); color: var(--grau); font-size: 14px; }
.detail h2 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 700; }
.detail h2 .marke { font-weight: 400; color: var(--grau); }
.detail .info { color: var(--grau); font-size: 15px; }
.detail-preis { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.detail-preis .schild .euro { font-size: 40px; }
.detail-preis .schild .cent { font-size: 20px; }
.detail-aktion { width: 100%; }
.detail-aktion[aria-pressed="true"] { background: var(--gruen); color: #fff; }
.detail-knoepfe { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.detail-knoepfe .knopf { padding-left: 8px; padding-right: 8px; }
.detail-fav[aria-pressed="true"] { background: var(--gelb, #FFD43B); color: #1a1a1a; border-color: transparent; }
.angebot .fav-stern { color: #E0A800; font-size: 14px; margin-right: 2px; }
.nie-hinweis { color: var(--grau); font-size: 13px; margin: -4px 0 0; text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .detail:not([hidden]) .detail-karte { animation: hoch .18s ease-out; }
  @keyframes hoch { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}

/* ---------- Markt-Kennzeichnung: Farbstreifen + Marktname in Marktfarbe ---------- */
.angebot, .posten { box-shadow: inset 5px 0 0 var(--mf, transparent); }
.angebot { padding-left: 18px; }
.angebot .markt { color: var(--mf, var(--grau)); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .angebot .markt { filter: brightness(1.25); }
}

/* ---------- Kategorien ---------- */
.kacheln { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.kachel {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
  background: var(--karte); border: 1px solid var(--linie); border-radius: var(--r);
  padding: 12px; min-height: 64px;
}
.kachel strong { font-size: 16px; line-height: 1.2; font-weight: 700; }
.kachel span { font-size: 13px; color: var(--grau); }
.kat-kopf { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; }
.kat-kopf h2 { margin: 0; font-size: 24px; font-stretch: 75%; font-weight: 800; line-height: 1.1; }
.zurueck {
  flex: none; border: 1px solid var(--linie); background: var(--karte); border-radius: 50%;
  width: 36px; height: 36px; display: grid; place-items: center; padding: 0;
}
.zurueck svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.sortierung { display: flex; gap: 6px; align-items: center; margin: 0 0 10px; font-size: 14px; color: var(--grau); }
.abschnitt-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.textknopf { border: 0; background: none; padding: 4px 0; font-size: 14px; color: var(--tinte); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Für dich ---------- */
.vorliebe-kopf { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 0 8px; }
.vorliebe-kopf:first-child { margin-top: 4px; }
.vorliebe-kopf h2 { margin: 0; font-size: 22px; font-stretch: 75%; font-weight: 800; }
.vorliebe-kopf button { border: 0; background: none; color: var(--grau); font-size: 14px; text-decoration: underline; }

/* ---------- Wochenliste ---------- */
.markt-gruppe { margin-bottom: 18px; }
.markt-kopf { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 6px; }
.markt-kopf h2 { margin: 0; font-size: 22px; font-stretch: 75%; font-weight: 800; }
.markt-kopf .summe { font-weight: 700; }
.posten { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; padding: 12px 10px 12px 12px; }
.posten input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--gruen); margin: 0; }
.posten .pname { line-height: 1.25; }
.posten .pinfo { font-size: 13px; color: var(--grau); }
.posten .ppreis { font-weight: 700; white-space: nowrap; }
.posten.erledigt .pname, .posten.erledigt .ppreis { text-decoration: line-through; color: var(--grau); }
.posten .weg { border: 0; background: none; font-size: 20px; color: var(--grau); padding: 4px 6px; }
.posten .abgelaufen { color: var(--rot); font-weight: 600; }
.gesamt { display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; margin: 8px 2px 16px; }
.listen-aktionen { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Einstellungen ---------- */
.abschnitt { margin-bottom: 26px; }
.abschnitt h2 { font-size: 20px; font-stretch: 75%; font-weight: 800; margin: 0 0 4px; }
.abschnitt p.erkl { margin: 0 0 10px; color: var(--grau); font-size: 14px; }
.wahl { display: grid; gap: 8px; }
.wahl label {
  display: flex; align-items: center; gap: 10px; background: var(--karte);
  border: 1px solid var(--linie); border-radius: var(--r); padding: 12px;
}
.wahl input { width: 20px; height: 20px; accent-color: var(--tinte); margin: 0; }
.wahl .klein { color: var(--grau); font-size: 13px; margin-left: auto; }
.markt-raster { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-liste { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tag {
  display: inline-flex; align-items: center; gap: 4px; background: var(--karte);
  border: 1px solid var(--linie); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 15px;
}
.tag button { border: 0; background: none; font-size: 18px; line-height: 1; color: var(--grau); padding: 0 4px; }
.zeile-form { display: flex; gap: 8px; }
.zeile-form input {
  flex: 1; min-width: 0; border: 1px solid var(--linie); border-radius: var(--r);
  background: var(--karte); padding: 10px 12px;
}
.quellen { font-size: 13px; color: var(--grau); margin: 0; padding-left: 18px; }
.quellen .fehler { color: var(--rot); }

/* ---------- Untere Leiste ---------- */
.leiste {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--karte); border-top: 1px solid var(--linie);
  padding-bottom: env(safe-area-inset-bottom);
}
.leiste-innen { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 640px; margin: 0 auto; }
.leiste button {
  border: 0; background: none; padding: 10px 2px 9px; font-size: 11.5px; color: var(--grau); min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative;
}
.leiste svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.leiste button[aria-current="page"] { color: var(--tinte); font-weight: 700; }
.leiste button[aria-current="page"]::before {
  content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; background: var(--rot); border-radius: 0 0 3px 3px;
}
.zaehler {
  position: absolute; top: 4px; left: calc(50% + 6px);
  background: var(--rot); color: #fff; font-size: 11px; font-weight: 800;
  min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; line-height: 18px;
}
.zaehler[hidden] { display: none; }

/* ---------- Vorrat ---------- */
.vorrat-erkl { margin: 0 0 12px; color: var(--grau); font-size: 14px; }
/* ---------- Anleitung ---------- */
.hilfe-knopf { width: 100%; margin-bottom: 22px; }
.hilfe-einl { color: var(--grau); font-size: 15px; margin: 0 0 14px; }
.hilfe details { scroll-margin-top: 90px; background: var(--karte); border: 1px solid var(--linie); border-radius: var(--r); margin-bottom: 8px; }
.hilfe summary { padding: 14px; font-weight: 700; font-size: 17px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
.hilfe summary::-webkit-details-marker { display: none; }
.hilfe summary::after { content: "+"; color: var(--grau); font-weight: 400; font-size: 20px; line-height: 1; }
.hilfe details[open] summary::after { content: "−"; }
.hilfe .inhalt { padding: 0 14px 14px; font-size: 15px; line-height: 1.45; }
.hilfe .inhalt p { margin: 0 0 8px; }
.hilfe .inhalt ul { margin: 0 0 8px; padding-left: 20px; }
.hilfe .inhalt li { margin-bottom: 4px; }
.hilfe .tipp { background: var(--papier); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--grau); }
.vorrat-liste { list-style: none; margin: 0 0 14px; padding: 0; background: var(--karte); border: 1px solid var(--linie); border-radius: var(--r); overflow: hidden; }
.vorrat-liste > li + li { border-top: 1px solid var(--linie); }
.vorrat-zeile { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 8px 12px 12px; }
.vorrat-zeile input[type=checkbox] { width: 26px; height: 26px; margin: 0; accent-color: var(--rot); }
.vorrat-name { font-size: 17px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.vorrat-status { font-size: 13px; color: var(--grau); margin-top: 2px; }
.vorrat-status .treffer { color: var(--gruen); font-weight: 700; }
.vorrat-status .leerbald { color: var(--rot); font-weight: 700; }
.vorrat-auf { border: 0; background: none; padding: 8px; color: var(--grau); }
.vorrat-auf svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
.vorrat-auf[aria-expanded="true"] svg { transform: rotate(180deg); }
.vorrat-details { padding: 0 12px 12px; display: grid; gap: 8px; }
.vorrat-details .zeile { display: flex; gap: 16px; flex-wrap: wrap; }
.vorschlag-titel { margin: 18px 0 6px; font-size: 14px; color: var(--grau); }
@media (prefers-reduced-motion: reduce) { .vorrat-auf svg { transition: none; } }

/* ---------- Erster Start ---------- */
.start { padding-top: 20px; }
.start h2 { font-size: 34px; line-height: 1.05; font-stretch: 65%; font-weight: 800; margin: 0 0 10px; }
.start p { color: var(--grau); margin: 0 0 18px; max-width: 34ch; }

.meldung {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--tinte); color: var(--papier); padding: 10px 16px; border-radius: var(--r);
  font-size: 15px; z-index: 20; max-width: calc(100% - 32px);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.meldung.an { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .meldung { transition: none; } }
</style>
</head>
<body>

<header class="kopf">
  <div class="kopf-zeile">
    <h1 id="titel">Angebote</h1>
    <button class="ort-knopf" id="ortKnopf" hidden></button>
  </div>
  <p class="stand" id="stand"></p>
</header>

<main id="inhalt">
  <section class="ansicht" id="v-start" hidden>
    <div class="start">
      <h2>Wo kaufst du ein?</h2>
      <p>Die App zeigt die Prospekt-Angebote der Supermärkte in deiner Gegend. Das lässt sich später in den Einstellungen ändern.</p>
      <div class="wahl" id="startOrte"></div>
    </div>
  </section>

  <section class="ansicht" id="v-fuerdich" hidden aria-label="Für dich"></section>

  <section class="ansicht" id="v-suche" hidden aria-label="Suche">
    <div class="suchfeld">
      <label for="such" class="sr">Angebote durchsuchen</label>
      <input id="such" type="search" placeholder="Butter, Kaffee, Bier …" autocomplete="off" enterkeyhint="search">

<div class="meldung" id="meldung" role="status" aria-live="polite"></div>

<script>
"use strict";

/* =========================================================================
   Zustand (wird nur auf diesem Gerät gespeichert)
   ========================================================================= */
const SPEICHER = "prospekt-app-v1";
const STANDARD_VORLIEBEN = ["Butter", "Kaffee", "Bier"];

function laden() {
  try { return JSON.parse(localStorage.getItem(SPEICHER)) || {}; } catch (e) { return {}; }
}
const zustand = Object.assign(
  { region: null, maerkte: {}, vorlieben: STANDARD_VORLIEBEN.slice(), liste: [], vorrat: [], favoriten: [], nie: [] },
  laden()
);
function speichern() {
  try { localStorage.setItem(SPEICHER, JSON.stringify(zustand)); } catch (e) { /* privates Fenster o.ä. */ }
}

let index = null;   // data/index.json
let daten = null;   // data/<region>.json
let alleAngebote = []; // aufbereitete, aktuell gültige Angebote
let angebote = [];     // davon ohne "Nie anzeigen"

/* =========================================================================
   Favoriten (bestimmte Produkte, egal in welchem Markt) und
   "Nie anzeigen" (Begriffe/Produkte, die überall ausgeblendet werden)
   ========================================================================= */
if (!Array.isArray(zustand.favoriten)) zustand.favoriten = [];
if (!Array.isArray(zustand.nie)) zustand.nie = [];

// Wörter eines Begriffs; jedes muss im Angebot vorkommen
function begriffWoerter(text) {
  return norm(text).split(/[\s,&/()+.-]+/).filter((w) => w.length >= 2);
}
function passtAlle(a, woerter) {
  return woerter.length > 0 && woerter.every((w) => a.such.includes(w));
}
function produktText(a) { return (a.m ? a.m + " " : "") + a.n; }

function nieTrifft(a) {
  return zustand.nie.some((n) => passtAlle(a, begriffWoerter(n)));
}
function nieFiltern() {
  angebote = alleAngebote.filter((a) => !nieTrifft(a));
}
function nieAnzahl(text) {
  const w = begriffWoerter(text);
  return alleAngebote.filter((a) => passtAlle(a, w)).length;
}

function favoritVon(a) {
  return zustand.favoriten.find((f) => passtAlle(a, begriffWoerter(f)));
}
function favoritAngebote() {
  const erlaubt = new Set(aktiveMaerkte());
  return sortiere(angebote.filter((a) => erlaubt.has(a.h) && favoritVon(a)));
}

/* =========================================================================
   Hilfen
   ========================================================================= */
const $ = (s) => document.querySelector(s);
const heute = () => new Date().toLocaleDateString("sv-SE"); // YYYY-MM-DD in lokaler Zeit

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function norm(s) {
  return String(s || "").toLowerCase()
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
    .normalize("NFD").replace(/[̀-ͯ]/g, "");
}
function eur(x) { return x == null ? "" : x.toFixed(2).replace(".", ",") + " €"; }
function datumKurz(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
}
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
function meldung(text) {
  const m = $("#meldung");
  m.textContent = text;
  m.classList.add("an");
  clearTimeout(meldung.t);
  meldung.t = setTimeout(() => m.classList.remove("an"), 2200);
}

/* Märkte, die in dieser Region angezeigt werden (Standard: alle) */
function aktiveMaerkte() {
  const alle = daten ? daten.maerkte : [];
  const gew = zustand.maerkte[zustand.region];
  return gew ? alle.filter((m) => gew.includes(m)) : alle;
}

/* =========================================================================
   Daten laden
   ========================================================================= */
async function ladeIndex() {
  const r = await fetch("data/index.json", { cache: "no-cache" });
  if (!r.ok) throw new Error("index");
  index = await r.json();
}

async function ladeRegion() {
  const r = await fetch(`data/${zustand.region}.json`, { cache: "no-cache" });
  if (!r.ok) throw new Error("region");
  daten = await r.json();
  const t = heute();
  alleAngebote = daten.angebote
    .filter((a) => !a.bis || a.bis >= t)           // abgelaufene weg
    .map((a) => {
      const id = hash([a.h, a.m, a.n, a.p, a.von, a.pk].join("|"));
      return Object.assign({}, a, {
        id,
        bald: a.von && a.von > t,
        such: norm([a.h, a.m, a.n, a.k, a.pk].join(" ")),
        kat: norm(a.k),
      });
    });
  nieFiltern();
  zeigeKopf();
  vorratZaehler();
}

function zeigeKopf() {
  const reg = index && index.regionen.find((r) => r.id === zustand.region);
  const ort = $("#ortKnopf");
  ort.hidden = !reg;
  ort.textContent = reg ? reg.name : "";
  if (daten && daten.stand) {
    const d = new Date(daten.stand);
    $("#stand").textContent = "Stand: " + d.toLocaleString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) + " Uhr";
  }
}

/* =========================================================================
   Suche
   ========================================================================= */
function vergleichswert(a) {
  // Erst nach Grundpreis (kg/l), Stückartikel danach nach Preis
  return a.gp != null && a.ge ? [0, a.gp] : [1, a.p ?? 9999];
}
let sortierung = "gp"; // "gp" = Grundpreis, "rabatt" = größter Rabatt zuerst

function rabatt(a) { return a.ap && a.p ? 1 - a.p / a.ap : 0; }

function sortiere(liste) {
  if (sortierung === "rabatt") {
    return liste.sort((x, y) => rabatt(y) - rabatt(x) || (x.p ?? 9999) - (y.p ?? 9999));
  }
  return liste.sort((x, y) => {
    const a = vergleichswert(x), b = vergleichswert(y);
    return a[0] - b[0] || a[1] - b[1];
  });
}

/* Liefert {passend, weitere}: "passend" = Kategorie trifft den Begriff.
   Mit "gruppe" wird nur innerhalb dieser Kategorie gesucht. */
function suche(begriff, maerkte, gruppe) {
  // Andere Wörter für dasselbe (Klopapier = Toilettenpapier) mitsuchen
  const schluessel = norm(begriff.trim()).replace(/\s+/g, " ");
  const andere = SYNONYME[schluessel] || [];
  const marken = MARKEN[schluessel] || [];
  const ohne = AUSSCHLUSS[schluessel] || [];
  if (!andere.length && !marken.length && !ohne.length) return sucheEinzeln(begriff, maerkte, gruppe);
  const passend = new Map(), weitere = new Map();
  for (const b of [begriff, ...andere]) {
    const e = sucheEinzeln(b, maerkte, gruppe);
    for (const a of e.passend) passend.set(a.id, a);
    for (const a of e.weitere) if (!passend.has(a.id)) weitere.set(a.id, a);
  }
  // Typische Marken (Pril, Fairy) zählen als passend, auch wenn "Spülmittel" nicht im Namen steht
  if (marken.length) {
    const erlaubt = new Set(maerkte);
    for (const a of angebote) {
      if (erlaubt.has(a.h) && (!gruppe || gruppeVon(a) === gruppe) && marken.includes(norm(a.m))) passend.set(a.id, a);
    }
  }
  // Bei klar abgegrenzten Begriffen zählt auch "Spülmittel-Konzentrat" (Wort steckt im Namen)
  if (ohne.length) for (const a of weitere.values()) if (norm(a.n).includes(schluessel)) passend.set(a.id, a);
  for (const id of passend.keys()) weitere.delete(id);
  // Was mit dem Begriff gemeint ist, aber anders heißt: Spülmittel ≠ Spülmaschinen-Tabs
  const raus = (a) => ohne.some((w) => a.such.includes(w));
  const p = [...passend.values()].filter((a) => !raus(a));
  const w = [...weitere.values()].concat([...passend.values()].filter(raus));
  return { passend: sortiere(p), weitere: sortiere(w) };
}
function sucheEinzeln(begriff, maerkte, gruppe) {
  const woerter = norm(begriff).split(/\s+/).filter(Boolean);
  if (!woerter.length) return { passend: [], weitere: [] };
  const erlaubt = new Set(maerkte);
  const treffer = angebote.filter((a) => erlaubt.has(a.h)
    && (!gruppe || gruppeVon(a) === gruppe)
    && woerter.every((w) => a.such.includes(w)));
  const katWort = (k) => k.split(/[\s,&/-]+/);
  const katPasst = (a) => woerter.some((w) => katWort(a.kat).includes(w));

  // Typische Gruppe(n) für den Begriff: wo liegen die Treffer, deren Kategorie passt?
  // Bei "butter" ist das "Milch, Käse & Eier" – Toastbrot oder Kekse fallen dann raus.
  const gruppenZahl = {};
  const katTreffer = treffer.filter(katPasst);
  for (const a of katTreffer) if (a.g) gruppenZahl[a.g] = (gruppenZahl[a.g] || 0) + 1;
  // Die häufigste Gruppe gilt immer, weitere nur bei klarem Gewicht (≥ 40 %)
  const rangfolge = Object.keys(gruppenZahl).sort((x, y) => gruppenZahl[y] - gruppenZahl[x]);
  const typisch = new Set(rangfolge.filter((g, i) => i === 0 || gruppenZahl[g] >= katTreffer.length * 0.4));

  const passend = [], weitere = [];
  for (const a of treffer) {
    if (typisch.size && a.g && !typisch.has(a.g)) { weitere.push(a); continue; }
    // Passend, wenn die Kategorie den Begriff enthält, das Angebot keine Kategorie hat,
    // oder ein Wort im Namen auf den Begriff endet ("Steinofenpizza", "Weidebutter",
    // aber nicht "Butterkäse" oder "Kaffeegetränk")
    const kw = katWort(a.kat);
    // Bei "Butter-Mandel-Stollen" zählt nur der letzte Teil ("stollen")
    const nameWoerter = norm(a.n).split(/[\s,&/()]+/).map((x) => x.split("-").pop());
    const ok = !a.kat
      || woerter.some((w) => kw.includes(w))
      || woerter.some((w) => nameWoerter.some((nw) => nw.endsWith(w)));
    (ok ? passend : weitere).push(a);
  }
  // Keine Kategorie-Treffer (z.B. Aldi ohne Kategorien): alles als passend zeigen
  if (!passend.length) return { passend: sortiere(weitere), weitere: [] };
  return { passend: sortiere(passend), weitere: sortiere(weitere) };
}

/* =========================================================================
   Darstellung eines Angebots
   ========================================================================= */
function schild(a) {
  if (a.p == null) return `<span class="schild aktion">Aktion</span>`;
  const [e, c] = a.p.toFixed(2).split(".");
  return `<span class="schild" aria-label="${eur(a.p)}"><span class="euro">${e},</span><span class="cent">${c}</span></span>`;
}

/* Eigene Kennfarben je Markt – bewusst NICHT die Firmenfarben */
const MARKT_FARBE = {
  "Lidl": "#2E7D6B", "Aldi": "#7A4FB3", "Penny": "#B5577D", "Netto": "#5E7A2E",
  "Rewe": "#8A5A3C", "Edeka": "#2F6F8F", "Kaufland": "#C26A2E", "K+K": "#3E8E5A",
  "Combi": "#9C6B1F", "famila": "#A2475A", "Norma": "#546E7A", "nahkauf": "#6D8C3A",
  "Rossmann": "#8E5BA0", "budni": "#1F7F86", "dm": "#7D6B5D",
};
function marktFarbe(h) { return MARKT_FARBE[h] || "#6B7280"; }

/* Produktbild: wird direkt von der Quelle geladen (nicht kopiert) */
function bildUrl(a) {
  if (!a.b) return "";
  if (a.b.startsWith("mg:")) return `https://cdn.marktguru.de/api/v1/offers/${encodeURIComponent(a.b.slice(3))}/images/default/0/medium.webp`;
  return a.b.startsWith("https://") ? a.b : "";
}
/* Ausschnitt aus einer Prospektseite (K+K, Norma): "ks:<url>#links,oben,rechts,unten" in % */
function zuschneiden(img) {
  const [l, o, r, u] = img.dataset.b.split(",").map(Number);
  const box = img.parentNode;
  const bw = box.clientWidth, bh = box.clientHeight;
  const w = img.naturalWidth * (r - l) / 100, h = img.naturalHeight * (u - o) / 100;
  const s = Math.min(bw / w, bh / h); // ganz sichtbar, zentriert
  img.style.width = img.naturalWidth * s + "px";
  img.style.height = img.naturalHeight * s + "px";
  img.style.left = (bw - w * s) / 2 - img.naturalWidth * s * l / 100 + "px";
  img.style.top = (bh - h * s) / 2 - img.naturalHeight * s * o / 100 + "px";
  img.style.opacity = 1;
}

function bildHTML(a) {
  const tipp = `data-detail="${a.id}" aria-label="Details zu ${esc((a.m ? a.m + " " : "") + a.n)}"`;
  if (a.b && a.b.startsWith("ks:https://")) {
    const [url, bereich] = a.b.slice(3).split("#");
    return `<button class="bild ausschnitt" ${tipp}><img src="${esc(url)}" data-b="${esc(bereich)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onload="zuschneiden(this)" onerror="this.parentNode.classList.add('leer');this.remove()"></button>`;
  }
  const url = bildUrl(a);
  if (!url) return `<button class="bild leer" ${tipp}></button>`;
  return `<button class="bild" ${tipp}><img src="${esc(url)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('leer');this.remove()"></button>`;
}

/* Größere Variante des Bildes für die Detailansicht (fällt auf das kleine zurück) */
function grossesBildUrl(a) {
  if (!a.b) return "";
  if (a.b.startsWith("mg:")) return `https://cdn.marktguru.de/api/v1/offers/${encodeURIComponent(a.b.slice(3))}/images/default/0/large.webp`;
  if (a.b.includes("scene7.com")) return a.b.replace(/wid=\d+&hei=\d+/, "wid=900&hei=900");
  return bildUrl(a);
}

/* ---------- Detailansicht ---------- */
let detailId = null;
function detailHTML(a) {
  const gemerkt = zustand.liste.some((x) => x.id === a.id);
  const spar = a.ap && a.p ? Math.round((1 - a.p / a.ap) * 100) : 0;
  let bild;
  if (a.b && a.b.startsWith("ks:https://")) {
    const [url, bereich] = a.b.slice(3).split("#");
    bild = `<div class="detail-bild ausschnitt"><img src="${esc(url)}" data-b="${esc(bereich)}" alt="" referrerpolicy="no-referrer" onload="zuschneiden(this)" onerror="this.parentNode.classList.add('leer');this.parentNode.textContent='Kein Bild verfügbar'"></div>`;
  } else if (bildUrl(a)) {
    bild = `<div class="detail-bild"><img class="ganz" src="${esc(grossesBildUrl(a))}" data-klein="${esc(bildUrl(a))}" alt="${esc((a.m ? a.m + " " : "") + a.n)}" referrerpolicy="no-referrer"
      onerror="if(this.dataset.klein&&this.src!==this.dataset.klein){this.src=this.dataset.klein}else{this.parentNode.classList.add('leer');this.parentNode.textContent='Kein Bild verfügbar'}"></div>`;
  } else {
    bild = `<div class="detail-bild leer">Kein Bild verfügbar</div>`;
  }
  const zeit = a.bald ? `ab ${esc(datumKurz(a.von))}` : a.bis ? `gültig bis ${esc(datumKurz(a.bis))}` : "";
  return `<div class="detail-karte" style="--mf:${marktFarbe(a.h)}">
    <div class="detail-kopf"><span class="markt">${esc(a.h)}</span><button class="detail-zu" data-detail-zu aria-label="Schließen">×</button></div>
    ${bild}
    <h2>${a.m ? `<span class="marke">${esc(a.m)}</span> ` : ""}${esc(a.n)}</h2>
    <div class="info">${[esc(a.pk), zeit].filter(Boolean).join(" · ")}</div>
    <div class="detail-preis">
      ${schild(a)}
      ${a.ap ? `<span class="alt">${eur(a.ap)}</span>${spar >= 5 ? `<span class="spar">−${spar} %</span>` : ""}` : ""}
      ${a.gp != null && a.ge ? `<span class="gp">${eur(a.gp)}/${a.ge}</span>` : ""}
    </div>
    <button class="knopf detail-aktion" data-merken="${a.id}" aria-pressed="${gemerkt}">${gemerkt ? "Auf der Wochenliste ✓" : "Auf die Wochenliste"}</button>
    <div class="detail-knoepfe">
      <button class="knopf leise detail-fav" data-favorit="${a.id}" aria-pressed="${!!favoritVon(a)}">${favoritVon(a) ? "★ Favorit" : "☆ Als Favorit"}</button>
      <button class="knopf leise" data-nie="${a.id}">Nie anzeigen</button>
    </div>
    <p class="nie-hinweis">Favoriten erscheinen oben unter „Für dich“, sobald sie im Angebot sind – in jedem Markt.</p>
  </div>`;
}
function oeffneDetail(id) {
  const a = angebote.find((x) => x.id === id);
  if (!a) return;
  detailId = id;
  const el = $("#detail");
  el.innerHTML = detailHTML(a);
  el.hidden = false;
  document.body.style.overflow = "hidden";
  history.pushState(Object.assign({}, history.state, { detail: id }), "");
  el.querySelector(".detail-zu").focus();
}
function schliesseDetail() {
  if (!detailId) return;
  detailId = null;
  $("#detail").hidden = true;
  $("#detail").innerHTML = "";
  document.body.style.overflow = "";
}

function angebotHTML(a) {
  const gemerkt = zustand.liste.some((x) => x.id === a.id);
  const spar = a.ap && a.p ? Math.round((1 - a.p / a.ap) * 100) : 0;
  const zeit = a.bald
    ? `<span class="bald">ab ${esc(datumKurz(a.von))}</span>`
    : a.bis ? `bis ${esc(datumKurz(a.bis))}` : "";
  const info = [esc(a.pk), zeit].filter(Boolean).join(", ");
  return `<li class="angebot" style="--mf:${marktFarbe(a.h)}">
    <div class="links">
      <span class="bild-rahmen">${bildHTML(a)}${merkKnopf(a, gemerkt)}</span>
      <div>
        <div class="markt">${esc(a.h)}</div>
        <div class="name">${favoritVon(a) ? `<span class="fav-stern" aria-label="Favorit">★</span>` : ""}${a.m ? `<span class="marke">${esc(a.m)}</span> ` : ""}${esc(a.n)}</div>
        ${info ? `<div class="info">${info}</div>` : ""}
      </div>
    </div>
    <div class="rechts">
      ${schild(a)}
      ${a.ap ? `<div class="preiszeile"><span class="alt">${eur(a.ap)}</span>${spar >= 5 ? `<span class="spar">−${spar} %</span>` : ""}</div>` : ""}
      ${a.gp != null && a.ge ? `<span class="gp">${eur(a.gp)}/${a.ge}</span>` : ""}
    </div>
  </li>`;
}

const ICON_PLUS = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`;
const ICON_HAKEN = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`;
function merkKnopf(a, gemerkt) {

/* =========================================================================
   Ansichten
   ========================================================================= */
const ANSICHTEN = ["start", "fuerdich", "suche", "vorrat", "liste", "einst", "hilfe"];
let aktuelleAnsicht = null;

function zeige(name) {
  aktuelleAnsicht = name;
  for (const v of ANSICHTEN) $("#v-" + v).hidden = v !== name;
  $("#leiste").hidden = name === "start";
  document.querySelectorAll(".leiste button").forEach((b) => {
    if (b.dataset.ziel === name || (name === "hilfe" && b.dataset.ziel === "einst")) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  const titel = { start: "Angebote", fuerdich: "Für dich", suche: "Suche", vorrat: "Vorrat", liste: "Wochenliste", einst: "Einstellungen", hilfe: "Anleitung" }[name];
  $("#titel").textContent = titel;
  if (name === "fuerdich") zeichneFuerDich();
  if (name === "suche") zeichneSuche();
  if (name === "vorrat") zeichneVorrat();
  if (name === "liste") zeichneListe();
  if (name === "einst") zeichneEinstellungen();
  if (name === "hilfe") zeichneHilfe();
  window.scrollTo(0, 0);
}

/* ---------- Zurück-Taste: Navigation im Browser-Verlauf ----------
   Jeder Schritt (Tab wechseln, Kategorie öffnen) wird ein Verlaufseintrag.
   "Zurück" führt so erst aus der Kategorie, dann zum vorigen Tab; erst auf
   der Startseite verlässt man die App. */
function aktuellerSchritt() {
  return { ansicht: aktuelleAnsicht, gruppe: sucheGruppe };
}
function geheZu(schritt) {
  const vorher = aktuellerSchritt();
  if (vorher.ansicht === schritt.ansicht && vorher.gruppe === (schritt.gruppe || null)) return;
  history.pushState(schritt, "");
  wendeAn(schritt);
}
function wendeAn(schritt) {
  const gruppe = schritt.gruppe || null;
  if (gruppe !== sucheGruppe) { sucheGruppe = gruppe; sucheUnter = null; anzeigeLimit = 50; }
  if (!gruppe && schritt.ansicht === "suche" && aktuelleAnsicht === "suche") $("#such").value = "";
  zeige(schritt.ansicht);
}
window.addEventListener("popstate", (e) => {
  // Offene Detailansicht: Zurück schließt nur sie, die Liste darunter bleibt wie sie war
  if (detailId && !(e.state && e.state.detail)) { schliesseDetail(); return; }
  if (e.state && e.state.ansicht && aktuelleAnsicht && aktuelleAnsicht !== "start") wendeAn(e.state);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && detailId) history.back();
});

}

/* ---------- Für dich ---------- */
const ausgeklappt = new Set();
const KEINE_MAERKTE = `<div class="leer-box"><p>Es ist kein Markt ausgewählt. Wähl in den Einstellungen aus, welche Märkte angezeigt werden sollen.</p>
  <button class="knopf" data-gehe="einst">Märkte auswählen</button></div>`;

/* =========================================================================
   Vorrat: dauerhafte Liste; "bald leer" = alle Angebote zeigen,
   sonst nur besonders gute Angebote (ab VORRAT_RABATT) zum Vorratskauf
   ========================================================================= */
const VORRAT_RABATT = 0.2;
const VORRAT_VORSCHLAEGE = ["Klopapier", "Küchenrolle", "Haferflocken", "Kaffee", "Spülmittel",
  "Waschmittel", "Zahnpasta", "Duschgel", "Müllbeutel", "Nudeln", "Milch", "Butter"];
// Wie es im Prospekt heißt (Schlüssel normalisiert: ä->ae usw.)
const SYNONYME = {
  klopapier: ["toilettenpapier"], toilettenpapier: ["klopapier"],
  kuechenrolle: ["kuechenpapier", "kuechentuecher", "haushaltsrolle"],
  zahnpasta: ["zahncreme"], zahncreme: ["zahnpasta"],
  spueli: ["spuelmittel"], waschpulver: ["waschmittel"],
  taschentuecher: ["taschentuch"], muellbeutel: ["muellsack", "abfallbeutel", "muellbeutel"],
  spuelmaschinentabs: ["geschirrspueltabs", "spuelmaschinen", "maschinengeschirr"],
  spuelmittel: ["geschirrspuelmittel", "handspuelmittel"],
  duschgel: ["duschbad", "dusche"], nudeln: ["pasta", "spaghetti", "penne", "fusilli"],
};

// Marken, die für den Begriff stehen (auch ohne das Wort im Namen)
const MARKEN = { spuelmittel: ["pril", "fairy"], spueli: ["pril", "fairy"] };
// Wörter, die beim Begriff etwas anderes meinen; solche Angebote stehen nur unter "Weitere Treffer"
const AUSSCHLUSS = {
  spuelmittel: ["tabs", "caps", "maschine", "klarspuel", "finish", "somat", "geschirr-reiniger", "spueltuch", "spueltuecher", "pulver", "weichspuel"],
  spueli: ["tabs", "caps", "maschine", "klarspuel", "finish", "somat", "geschirr-reiniger"],
  klopapier: ["feucht"], toilettenpapier: ["feucht"],
  waschmittel: ["weichspuel", "waeschepar", "fleckent", "enthaert", "hygienespuel"],
  butter: ["margarine", "rama"],
  milch: ["muellermilch", "shake", "buttermilch", "kondens", "kaffee-milch", "kaffeemilch", "milchreis", "schokolade"],
  kaffee: ["maschine", "vollautomat", "becher", "filtertuete", "entkalker"],
};

if (!Array.isArray(zustand.vorrat)) zustand.vorrat = [];

function vorratBegriffe(name) {
  const teile = name.split(/[,/]/).map((x) => x.trim()).filter(Boolean);
  const alle = new Set(teile);
  for (const t of teile) for (const s of SYNONYME[norm(t)] || []) alle.add(s);
  return [...alle];
}
function vorratAngebote(eintrag) {
  const maerkte = aktiveMaerkte();
  const gesehen = new Map();
  for (const b of vorratBegriffe(eintrag.name)) {
    for (const a of suche(b, maerkte).passend) gesehen.set(a.id, a);
  }
  // Genauer als die Suche: Was heißt wirklich so ("Toilettenpapier", "Röstkaffee")?
  // In deren Unterkategorien bleibt alles, der Rest (Cappuccino-Pulver, Kaffeemaschine) fällt raus.
  const begriffe = vorratBegriffe(eintrag.name).map((b) => norm(b).replace(/\s+/g, ""));
  const ohne = vorratBegriffe(eintrag.name).flatMap((b) => AUSSCHLUSS[norm(b).trim()] || []);
  const kandidaten = [...gesehen.values()].filter((a) => !ohne.some((w) => a.such.includes(w)));
  const kern = kandidaten.filter((a) => norm(a.n).split(/[\s,&/()+]+/).some((w) => begriffe.some((b) => w.endsWith(b))));
  let treffer = kandidaten;
  if (kern.length) {
    const zahl = {};
    for (const a of kern) if (a.u) zahl[a.u] = (zahl[a.u] || 0) + 1;
    const rang = Object.keys(zahl).sort((x, y) => zahl[y] - zahl[x]);
    const unter = new Set(rang.filter((u, i) => i === 0 || zahl[u] >= kern.length * 0.25));
    const kernIds = new Set(kern.map((a) => a.id));
    treffer = kandidaten.filter((a) => a.u ? unter.has(a.u) : kernIds.has(a.id));
  }
  const alle = sortiere(treffer);
  const gut = alle.filter((a) => rabatt(a) >= VORRAT_RABATT);
  return { alle, gut, relevant: eintrag.leer ? alle : gut };
}

function vorratZaehler() {
  const z = $("#vorratZaehler");
  if (!z) return;
  const n = angebote.length ? zustand.vorrat.filter((v) => v.leer && vorratAngebote(v).alle.length).length : 0;
  z.hidden = !n;
  z.textContent = n;
}

const ICON_AUF = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>`;
const vorratOffen = new Set();

function zeichneVorrat() {
  const el = $("#v-vorrat");
  if (!aktiveMaerkte().length) { el.innerHTML = KEINE_MAERKTE; return; }
  const formular = `<form class="zeile-form" id="vorratForm" style="margin-bottom:12px">
      <label for="vorratNeu" class="sr">Neuer Vorrat-Eintrag</label>
      <input id="vorratNeu" placeholder="z.B. Klopapier, Haferflocken" autocomplete="off" enterkeyhint="done">
      <button class="knopf" type="submit">Hinzufügen</button>
    </form>`;
  const vorhanden = new Set(zustand.vorrat.map((v) => norm(v.name)));
  const vorschlaege = VORRAT_VORSCHLAEGE.filter((v) => !vorhanden.has(norm(v)));
  const vorschlagHTML = vorschlaege.length
    ? `<p class="vorschlag-titel">Schnell hinzufügen</p><div class="vorschlaege">${vorschlaege.map((v) =>
        `<button class="chip" data-vorrat-neu="${esc(v)}">+ ${esc(v)}</button>`).join("")}</div>` : "";

  if (!zustand.vorrat.length) {
    el.innerHTML = formular + `<div class="leer-box"><p>Trag hier ein, was ihr regelmäßig braucht. Hak an, was <strong>bald leer</strong> ist, dann siehst du alle Angebote dazu. Bei allem anderen meldet sich die App nur bei richtig guten Angeboten (ab ${Math.round(VORRAT_RABATT * 100)} % Rabatt), damit du auf Vorrat kaufen kannst.</p></div>` + vorschlagHTML;
    return;
  }

  // "bald leer" zuerst, sonst Reihenfolge beibehalten
  const reihen = zustand.vorrat.map((v, i) => ({ v, i })).sort((x, y) => (y.v.leer ? 1 : 0) - (x.v.leer ? 1 : 0));
  const zeilen = reihen.map(({ v, i }) => {
    const { alle, gut, relevant } = vorratAngebote(v);
    const offen = vorratOffen.has(v.name);
    let status;
    if (v.leer) {
      status = alle.length
        ? `<span class="leerbald">Bald leer</span> · <span class="treffer">${alle.length === 1 ? "1 Angebot" : alle.length + " Angebote"}</span>, ab ${eur(alle.slice().sort((a, b) => (a.p ?? 1e9) - (b.p ?? 1e9))[0].p)}`
        : `<span class="leerbald">Bald leer</span> · gerade kein Angebot`;
    } else {
      status = gut.length
        ? `Genug da · <span class="treffer">${gut.length === 1 ? "1 gutes Angebot" : gut.length + " gute Angebote"}</span> zum Vorratskauf`
        : `Genug da · ${alle.length ? `${alle.length === 1 ? "1 Angebot, nicht" : alle.length + " Angebote, keins"} besonders günstig` : "kein Angebot"}`;
    }
    const details = offen ? `<div class="vorrat-details">
        ${relevant.length ? listeHTML(relevant, 5) : `<p class="hinweis" style="padding:4px 0">${v.leer ? "Diese Woche kein Angebot." : "Kein Angebot mit mindestens " + Math.round(VORRAT_RABATT * 100) + " % Rabatt."}</p>`}
        <div class="zeile">
          ${alle.length ? `<button class="textknopf" data-suche="${esc(vorratBegriffe(v.name)[0])}">Alle ${alle.length} in der Suche</button>` : ""}
          <button class="textknopf" data-vorrat-weg="${i}">Entfernen</button>
        </div>
      </div>` : "";
    return `<li>
      <div class="vorrat-zeile">
        <input type="checkbox" data-vorrat-haken="${i}" ${v.leer ? "checked" : ""} aria-label="${esc(v.name)} ist bald leer">
        <div><div class="vorrat-name">${esc(v.name)}</div><div class="vorrat-status">${status}</div></div>
        <button class="vorrat-auf" data-vorrat-auf="${esc(v.name)}" aria-expanded="${offen}" aria-label="Angebote zu ${esc(v.name)} ${offen ? "zuklappen" : "zeigen"}">${ICON_AUF}</button>
      </div>${details}</li>`;
  }).join("");
  el.innerHTML = formular +
    `<p class="vorrat-erkl">Haken = bald leer: alle Angebote. Ohne Haken: nur Angebote ab ${Math.round(VORRAT_RABATT * 100)} % Rabatt. <button class="textknopf" data-hilfe="vorrat">Mehr dazu</button></p>` +
    `<ul class="vorrat-liste">${zeilen}</ul>` + vorschlagHTML;
}

function vorratHinzufuegen(name) {
  name = name.trim();
  if (!name || zustand.vorrat.some((v) => norm(v.name) === norm(name))) return false;
  zustand.vorrat.push({ name, leer: false });
  speichern();
  return true;
}

/* Block oben auf "Für dich": was bald leer ist und gerade im Angebot */
function vorratBlockHTML() {
  if (!zustand.vorrat.length) return "";
  const leer = [], vorrat = [];
  for (const v of zustand.vorrat) {
    const { alle, gut } = vorratAngebote(v);
    if (v.leer && alle.length) leer.push({ v, a: alle[0], n: alle.length });
    else if (!v.leer && gut.length) vorrat.push({ v, a: gut.slice().sort((a, b) => rabatt(b) - rabatt(a))[0], n: gut.length });
  }
  // je Eintrag: Name + Anzahl, darunter das beste Angebot
  const block = (eintraege, einzahl, mehrzahl) => eintraege.map(({ v, a, n }) =>
    `<p class="zwischentitel">${esc(v.name)} · ${n === 1 ? "1 " + einzahl : n + " " + mehrzahl}</p>${listeHTML([a])}`).join("");
  return (leer.length ? `<div class="vorliebe-kopf"><h2>Bald leer, jetzt im Angebot</h2><button data-gehe="vorrat">Vorrat</button></div>${block(leer, "Angebot", "Angebote")}` : "") +
    (vorrat.length ? `<div class="vorliebe-kopf"><h2>Gut für den Vorrat</h2><button data-gehe="vorrat">Vorrat</button></div>${block(vorrat, "gutes Angebot", "gute Angebote")}` : "");
}

/* Block ganz oben auf "Für dich": Favoriten, die gerade im Angebot sind */
function favoritBlockHTML() {

}

function zeichneFuerDich() {
  const el = $("#v-fuerdich");

/* ---------- Suche & Kategorien ---------- */
let sucheMarkt = null;   // null = alle aktiven
let sucheGruppe = null;  // gewählte Kategorie oder null
let sucheUnter = null;   // gewählte Unterkategorie oder null
let anzeigeLimit = 50;   // große Listen schrittweise zeigen

// Reihenfolge der Kacheln (wie im Laden: frisch zuerst, Non-Food zuletzt).
// Die Daten bringen die aktuelle Liste samt Unterkategorien mit; dies ist nur der Rückfall.
const GRUPPEN_STANDARD = [
  "Obst & Gemüse", "Fleisch & Wurst", "Fisch", "Milch, Käse & Eier", "Brot & Backwaren",
  "Tiefkühl", "Fertiggerichte & Konserven", "Vorrat & Backen", "Frühstück & Aufstriche",
  "Süßes & Snacks", "Kaffee & Tee", "Getränke", "Bier", "Wein & Sekt", "Spirituosen",
  "Drogerie & Pflege", "Baby & Kind", "Haushalt & Reinigung", "Tierbedarf",
  "Kleidung & Schuhe", "Haus, Garten & Deko", "Elektronik & Technik", "Sonstiges",
];
function gruppenListe() { return daten && daten.gruppen ? Object.keys(daten.gruppen) : GRUPPEN_STANDARD; }
function unterListe(g) { return (daten && daten.gruppen && daten.gruppen[g]) || []; }
function gruppeVon(a) { return a.g || "Sonstiges"; }

function unterChips(liste) {
  const zahl = {};
  for (const a of liste) if (a.u) zahl[a.u] = (zahl[a.u] || 0) + 1;
  const vorhanden = unterListe(sucheGruppe).filter((u) => zahl[u]);
  if (vorhanden.length < 2) return "";
  return `<div class="chips" role="group" aria-label="Unterkategorie">
    <button class="chip" data-unter="" aria-pressed="${sucheUnter === null}">Alle ${liste.length}</button>
    ${vorhanden.map((u) => `<button class="chip" data-unter="${esc(u)}" aria-pressed="${sucheUnter === u}">${esc(u)} ${zahl[u]}</button>`).join("")}
  </div>`;
}

const ICON_ZURUECK = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`;

function sortierChips() {
  return `<div class="sortierung" role="group" aria-label="Sortierung">Sortieren:
    <button class="chip" data-sort="gp" aria-pressed="${sortierung === "gp"}">Grundpreis</button>
    <button class="chip" data-sort="rabatt" aria-pressed="${sortierung === "rabatt"}">Größter Rabatt</button>
  </div>`;
}

function begrenzteListe(liste) {
  const mehr = liste.length > anzeigeLimit;
  return listeHTML(liste, anzeigeLimit) +
    (mehr ? `<button class="mehr" data-mehr>Weitere ${Math.min(50, liste.length - anzeigeLimit)} von ${liste.length - anzeigeLimit} zeigen</button>` : "");
}

function kachelnHTML() {
  const erlaubt = new Set(sucheMarkt ? [sucheMarkt] : aktiveMaerkte());
  const zahl = {};
  for (const a of angebote) if (erlaubt.has(a.h)) zahl[gruppeVon(a)] = (zahl[gruppeVon(a)] || 0) + 1;
  const vorhanden = gruppenListe().filter((g) => zahl[g]);
  if (!vorhanden.length) return `<p class="hinweis">Diese Woche keine Angebote${sucheMarkt ? " bei " + esc(sucheMarkt) : ""}.</p>`;
  return `<p class="zwischentitel">Kategorien${sucheMarkt ? " bei " + esc(sucheMarkt) : ""}</p><div class="kacheln">${vorhanden.map((g) =>
    `<button class="kachel" data-gruppe="${esc(g)}"><strong>${esc(g)}</strong><span>${zahl[g] === 1 ? "1 Angebot" : zahl[g] + " Angebote"}</span></button>`).join("")}</div>`;
}
function zeichneMarktChips() {
  const m = aktiveMaerkte();
  $("#marktChips").innerHTML =
    `<button class="chip" data-markt="" aria-pressed="${sucheMarkt === null}">Alle Märkte</button>` +

/* Filterzeilen (Märkte, Unterkategorien) behalten beim Neuzeichnen ihre Scroll-Position */
function zeichneSuche() {
  const pos = {};
  document.querySelectorAll("#v-suche .chips[aria-label]").forEach((el) => { pos[el.getAttribute("aria-label")] = el.scrollLeft; });
  zeichneSucheInnen();
  document.querySelectorAll("#v-suche .chips[aria-label]").forEach((el) => {
    const p = pos[el.getAttribute("aria-label")];
    if (p) el.scrollLeft = p;
  });
}

function zeichneSucheInnen() {
  zeichneMarktChips();
  const begriff = $("#such").value.trim();
  $("#leeren").hidden = !begriff;
  $("#such").placeholder = sucheGruppe ? `In „${sucheGruppe}“ suchen` : "Butter, Kaffee, Bier …";
  const ziel = $("#sucheErgebnis");
  if (!aktiveMaerkte().length) { ziel.innerHTML = KEINE_MAERKTE; return; }
  const maerkte = sucheMarkt ? [sucheMarkt] : aktiveMaerkte();
  const beiMarkt = sucheMarkt ? ` bei ${esc(sucheMarkt)}` : "";
  const kopf = sucheGruppe
    ? `<div class="kat-kopf"><button class="zurueck" data-gruppe="" aria-label="Zurück zu allen Kategorien">${ICON_ZURUECK}</button><h2>${esc(sucheGruppe)}</h2></div>`
    : "";

  // Startansicht: Vorlieben + Kategorie-Kacheln
  if (!begriff && !sucheGruppe) {
    ziel.innerHTML =
      (zustand.vorlieben.length
        ? `<p class="zwischentitel">Deine Vorlieben</p><div class="vorschlaege">${zustand.vorlieben.map((v) => `<button class="chip" data-suche="${esc(v)}">${esc(v)}</button>`).join("")}</div>`
        : "") + kachelnHTML();
    return;
  }

  // Kategorie ohne Suchbegriff: alles aus der Kategorie
  if (!begriff) {
    const erlaubt = new Set(maerkte);
    const ganz = angebote.filter((a) => erlaubt.has(a.h) && gruppeVon(a) === sucheGruppe);
    if (sucheUnter && !ganz.some((a) => a.u === sucheUnter)) sucheUnter = null;
    const liste = sortiere(sucheUnter ? ganz.filter((a) => a.u === sucheUnter) : ganz.slice());
    ziel.innerHTML = kopf + unterChips(ganz) + sortierChips() + (liste.length
      ? `<p class="zwischentitel">${liste.length === 1 ? "1 Angebot" : liste.length + " Angebote"}${sucheUnter ? " in " + esc(sucheUnter) : ""}${beiMarkt}</p>${begrenzteListe(liste)}`
      : `<p class="hinweis">Diese Woche nichts aus dieser Kategorie${beiMarkt}.</p>`);
    return;
  }

  // Suche (ggf. innerhalb der Kategorie)
  const { passend, weitere } = suche(begriff, maerkte, sucheGruppe);
  if (!passend.length && !weitere.length) {
    ziel.innerHTML = kopf + `<p class="hinweis">Keine Angebote zu <strong>„${esc(begriff)}“</strong>${beiMarkt}${sucheGruppe ? ` in dieser Kategorie` : ""}. Versuch einen allgemeineren Begriff.</p>`;
    return;
  }
  ziel.innerHTML = kopf + sortierChips() +
    (passend.length ? `<p class="zwischentitel">${passend.length === 1 ? "1 Angebot" : passend.length + " Angebote"}</p>${begrenzteListe(passend)}` : "") +
    (weitere.length ? `<p class="zwischentitel">Weitere Treffer mit „${esc(begriff)}“</p>${listeHTML(weitere, 30)}` : "");
}

/* ---------- Wochenliste ---------- */
function zeichneListe() {
  const el = $("#v-liste");
  const t = heute();
  if (!zustand.liste.length) {
    el.innerHTML = `<div class="leer-box"><p>Deine Wochenliste ist leer. Tipp bei einem Angebot auf das +, dann landet es hier, sortiert nach Markt.</p>
      <button class="knopf" data-gehe="suche">Angebote suchen</button></div>`;
    return;
  }
  const gruppen = {};
  for (const p of zustand.liste) (gruppen[p.a.h] ||= []).push(p);
  let gesamt = 0;
  const html = Object.keys(gruppen).sort().map((markt) => {
    const posten = gruppen[markt];
    const summe = posten.filter((p) => !p.erledigt).reduce((s, p) => s + (p.a.p || 0), 0);
    gesamt += summe;
    return `<div class="markt-gruppe">
      <div class="markt-kopf"><h2>${esc(markt)}</h2><span class="summe">${summe ? eur(summe) : ""}</span></div>
      <ul class="liste">${posten.map((p) => {
        const abgel = p.a.bis && p.a.bis < t;
        return `<li class="posten${p.erledigt ? " erledigt" : ""}" style="--mf:${marktFarbe(markt)}">
          <input type="checkbox" data-abhaken="${p.id}" ${p.erledigt ? "checked" : ""} aria-label="${esc(p.a.n)} abhaken">
          <div><div class="pname">${p.a.m ? esc(p.a.m) + " " : ""}${esc(p.a.n)}</div>
            <div class="pinfo">${[esc(p.a.pk), abgel ? `<span class="abgelaufen">abgelaufen</span>` : p.a.bis ? "bis " + esc(datumKurz(p.a.bis)) : ""].filter(Boolean).join(", ")}</div></div>
          <span class="ppreis">${p.a.p != null ? eur(p.a.p) : "Aktion"}</span>
          <button class="weg" data-entfernen="${p.id}" aria-label="${esc(p.a.n)} entfernen">×</button>
        </li>`;
      }).join("")}</ul></div>`;
  }).join("");
  el.innerHTML = html +
    `<div class="gesamt"><span>Noch zu kaufen</span><span>${eur(gesamt)}</span></div>
     <div class="listen-aktionen">
       <button class="knopf leise" data-aktion="erledigte">Erledigte entfernen</button>
       <button class="knopf leise" data-aktion="teilen">Liste teilen</button>
       <button class="knopf leise" data-aktion="leeren">Liste leeren</button>
     </div>`;
}

function listenZaehler() {
  const offen = zustand.liste.filter((p) => !p.erledigt).length;
  const z = $("#listenZaehler");
  z.hidden = !offen;
  z.textContent = offen;
}

function merken(id) {
  const i = zustand.liste.findIndex((p) => p.id === id);
  if (i >= 0) {
    zustand.liste.splice(i, 1);
    meldung("Von der Wochenliste entfernt");
  } else {
    const a = angebote.find((x) => x.id === id);
    if (!a) return;
    // Kopie speichern, damit die Liste auch nach dem nächsten Datenabruf stimmt
    zustand.liste.push({ id, erledigt: false, a: { h: a.h, m: a.m, n: a.n, p: a.p, pk: a.pk, bis: a.bis } });
    meldung(`Auf der Wochenliste (${a.h})`);
  }
  speichern();
  listenZaehler();
  const drauf = zustand.liste.some((p) => p.id === id);
  const a = angebote.find((x) => x.id === id);
  document.querySelectorAll(`[data-merken="${id}"]`).forEach((b) => {
    if (b.classList.contains("detail-aktion")) {
      b.setAttribute("aria-pressed", drauf);
      b.textContent = drauf ? "Auf der Wochenliste ✓" : "Auf die Wochenliste";
    } else if (a) b.outerHTML = merkKnopf(a, drauf);
  });
}

function favoritUmschalten(id) {
  const a = angebote.find((x) => x.id === id);
  if (!a) return;
  const f = favoritVon(a);
  if (f) {
    zustand.favoriten = zustand.favoriten.filter((x) => x !== f);
    meldung("Kein Favorit mehr");
  } else {
    zustand.favoriten.push(produktText(a));
    meldung("Als Favorit gespeichert");
  }
  speichern();
  const b = document.querySelector(`[data-favorit="${id}"]`);
  if (b) { const jetzt = !!favoritVon(a); b.setAttribute("aria-pressed", jetzt); b.textContent = jetzt ? "★ Favorit" : "☆ Als Favorit"; }
  neuZeichnen();
}
function nieHinzufuegen(text) {
  text = text.trim();
  if (!text || zustand.nie.some((x) => norm(x) === norm(text))) return false;
  zustand.nie.push(text);
  speichern();
  nieFiltern();
  vorratZaehler();
  neuZeichnen();
  return true;
}
// Aktuelle Ansicht unter der Detailansicht auffrischen
function neuZeichnen() {
  if (aktuelleAnsicht === "fuerdich") zeichneFuerDich();
  else if (aktuelleAnsicht === "suche") zeichneSuche();
  else if (aktuelleAnsicht === "vorrat") zeichneVorrat();
}

async function listeTeilen() {
  const gruppen = {};
  for (const p of zustand.liste.filter((p) => !p.erledigt)) (gruppen[p.a.h] ||= []).push(p);
  const text = Object.keys(gruppen).sort().map((m) =>
    m + ":\n" + gruppen[m].map((p) => `- ${p.a.m ? p.a.m + " " : ""}${p.a.n}${p.a.p != null ? " (" + eur(p.a.p) + ")" : ""}`).join("\n")
  ).join("\n\n");
  if (!text) { meldung("Nichts mehr offen auf der Liste"); return; }
  try {
    if (navigator.share) await navigator.share({ title: "Wochenliste", text });
    else { await navigator.clipboard.writeText(text); meldung("Liste kopiert"); }
  } catch (e) { /* Teilen abgebrochen */ }
}

document.addEventListener("click", async (ev) => {
  if (ev.target.id === "detail") { history.back(); return; }  // Tipp neben die Karte
  const t = ev.target.closest("button, [data-region]");
  if (!t) return;
  const d = t.dataset;

  if (d.detail) oeffneDetail(d.detail);
  else if (d.detailZu !== undefined) history.back();
  else if (d.ziel) geheZu({ ansicht: d.ziel, gruppe: d.ziel === "suche" ? sucheGruppe : null });
  else if (d.gehe) geheZu({ ansicht: d.gehe, gruppe: null });
  else if (d.hilfe) { hilfeOffen = d.hilfe; geheZu({ ansicht: "hilfe", gruppe: null }); }
  else if (d.region) {
    zustand.region = d.region; speichern();
    await start();
  }
  else if (d.merken) merken(d.merken);
  else if (d.favorit) favoritUmschalten(d.favorit);
  else if (d.nie) {
    const a = angebote.find((x) => x.id === d.nie);
    if (a) {
      nieHinzufuegen(produktText(a));
      history.back();  // schließt die Detailansicht
      meldung(`„${produktText(a)}“ wird nicht mehr angezeigt`);
    }
  }
  else if (d.favoritWeg !== undefined) {
    zustand.favoriten.splice(+d.favoritWeg, 1);
    speichern(); zeichneEinstellungen();
  }
  else if (d.nieWeg !== undefined) {
    const v = zustand.nie.splice(+d.nieWeg, 1)[0];
    speichern(); nieFiltern(); vorratZaehler(); zeichneEinstellungen();
    if (v) meldung(`„${v}“ wird wieder angezeigt`);
  }
  else if (d.suche !== undefined) {
    $("#such").value = d.suche;
    if (aktuelleAnsicht === "suche" && !sucheGruppe) zeichneSuche();
    else geheZu({ ansicht: "suche", gruppe: null });
  }
  else if (d.klappen) {
    ausgeklappt.has(d.klappen) ? ausgeklappt.delete(d.klappen) : ausgeklappt.add(d.klappen);
    zeichneFuerDich();
  }
  else if (d.markt !== undefined) {
    sucheMarkt = d.markt || null;
    anzeigeLimit = 50;
    zeichneSuche();
  }
  else if (d.unter !== undefined) {
    sucheUnter = d.unter || null;
    anzeigeLimit = 50;
    zeichneSuche();
  }
  else if (d.gruppe !== undefined) {
    if (d.gruppe) {
      $("#such").value = "";
      geheZu({ ansicht: "suche", gruppe: d.gruppe });
    } else if (history.state && history.state.gruppe) {
      history.back();  // Pfeil in der Kategorie = Zurück-Taste
    } else {
      wendeAn({ ansicht: "suche", gruppe: null });
    }
  }
  else if (d.sort) {
    sortierung = d.sort;
    zeichneSuche();
  }
  else if (d.mehr !== undefined) {
    anzeigeLimit += 50;
    zeichneSuche();
  }
  else if (d.marktSchalter) {
    const aktiv = new Set(aktiveMaerkte());
    aktiv.has(d.marktSchalter) ? aktiv.delete(d.marktSchalter) : aktiv.add(d.marktSchalter);
    zustand.maerkte[zustand.region] = [...aktiv];
    vorratZaehler();
    if (sucheMarkt && !aktiv.has(sucheMarkt)) sucheMarkt = null;
    speichern();
    zeichneEinstellungen();
  }
  else if (d.alleMaerkte) {
    zustand.maerkte[zustand.region] = d.alleMaerkte === "an" ? [...daten.maerkte] : [];
    vorratZaehler();
    sucheMarkt = null;
    speichern();
    zeichneEinstellungen();
  }
  else if (d.vorratNeu) {
    vorratHinzufuegen(d.vorratNeu);
    meldung(`„${d.vorratNeu}“ zum Vorrat hinzugefügt`);
    zeichneVorrat(); vorratZaehler();
  }
  else if (d.vorratAuf !== undefined) {
    vorratOffen.has(d.vorratAuf) ? vorratOffen.delete(d.vorratAuf) : vorratOffen.add(d.vorratAuf);
    zeichneVorrat();
  }
  else if (d.vorratWeg !== undefined) {
    const v = zustand.vorrat[+d.vorratWeg];
    if (v) {
      zustand.vorrat.splice(+d.vorratWeg, 1);
      vorratOffen.delete(v.name);
      speichern(); vorratZaehler(); zeichneVorrat();
      meldung(`„${v.name}“ entfernt`);
    }
  }
  else if (d.vorliebeWeg !== undefined) {
    zustand.vorlieben.splice(+d.vorliebeWeg, 1);
    speichern();
    zeichneEinstellungen();
  }
  else if (d.entfernen) {
    zustand.liste = zustand.liste.filter((p) => p.id !== d.entfernen);
    speichern(); listenZaehler(); zeichneListe();
  }
  else if (d.aktion === "erledigte") {
    zustand.liste = zustand.liste.filter((p) => !p.erledigt);
    speichern(); listenZaehler(); zeichneListe();
  }
  else if (d.aktion === "leeren") {
    if (confirm("Wochenliste komplett leeren?")) {
      zustand.liste = []; speichern(); listenZaehler(); zeichneListe();
    }
  }
  else if (d.aktion === "teilen") listeTeilen();
  else if (t.id === "leeren") { $("#such").value = ""; zeichneSuche(); $("#such").focus(); }
  else if (t.id === "ortKnopf") geheZu({ ansicht: "einst", gruppe: null });
});

document.addEventListener("change", async (ev) => {
  const t = ev.target;
  if (t.dataset.vorratHaken !== undefined) {
    const v = zustand.vorrat[+t.dataset.vorratHaken];
    if (v) {
      v.leer = t.checked;
      speichern(); vorratZaehler(); zeichneVorrat();
      meldung(v.leer ? `${v.name}: bald leer – alle Angebote werden gezeigt` : `${v.name}: genug da`);
    }
    return;
  }
  if (t.dataset.abhaken) {
    const p = zustand.liste.find((x) => x.id === t.dataset.abhaken);
    if (p) { p.erledigt = t.checked; speichern(); listenZaehler(); zeichneListe(); }
  }
  if (t.name === "region") {
    zustand.region = t.value; sucheMarkt = null; speichern();
    await ladeRegionSicher();
    zeichneEinstellungen();
    meldung("Ort geändert");
  }
});

document.addEventListener("submit", (ev) => {
  if (ev.target.id === "vorratForm") {
    ev.preventDefault();
    const inp = $("#vorratNeu");
    if (vorratHinzufuegen(inp.value)) meldung(`„${inp.value.trim()}“ zum Vorrat hinzugefügt`);
    zeichneVorrat(); vorratZaehler();
    $("#vorratNeu").focus();
    return;
  }
  if (ev.target.id === "nieForm") {
    ev.preventDefault();
    const v = $("#nieNeu").value.trim();
    if (v && nieHinzufuegen(v)) meldung(`${nieAnzahl(v) === 1 ? "1 Angebot" : nieAnzahl(v) + " Angebote"} ausgeblendet`);
    zeichneEinstellungen();
    $("#nieNeu").focus();
    return;
  }
  if (ev.target.id !== "vorliebeForm") return;
  ev.preventDefault();
  const inp = $("#vorliebeNeu");
  const v = inp.value.trim();
  if (v && !zustand.vorlieben.some((x) => norm(x) === norm(v))) {
    zustand.vorlieben.push(v);
    speichern();
  }
  zeichneEinstellungen();
  $("#vorliebeNeu").focus();
});

let suchTimer;
$("#such").addEventListener("input", () => {
  clearTimeout(suchTimer);
  suchTimer = setTimeout(zeichneSuche, 150);
});

/* =========================================================================
   Start
   ========================================================================= */
function fehlerAnzeigen() {
  $("#v-fuerdich").innerHTML = `<div class="leer-box"><p>Die Angebote konnten nicht geladen werden. Prüf deine Internetverbindung und lade die Seite neu.</p>
    <button class="knopf" onclick="location.reload()">Neu laden</button></div>`;
  zeige("fuerdich");
}

async function ladeRegionSicher() {
  try { await ladeRegion(); return true; }
  catch (e) { fehlerAnzeigen(); return false; }
}

async function start() {
  try { if (!index) await ladeIndex(); }
  catch (e) { fehlerAnzeigen(); return; }
  if (!zustand.region || !index.regionen.some((r) => r.id === zustand.region)) {
    zeichneStart();
    return;
  }
  if (await ladeRegionSicher()) {
    listenZaehler();
    vorratZaehler();
    history.replaceState({ ansicht: "fuerdich", gruppe: null }, "");
    zeige("fuerdich");
  }
}

start();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
